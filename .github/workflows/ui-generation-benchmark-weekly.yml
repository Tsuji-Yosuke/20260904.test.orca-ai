name: UI Generation Benchmark Weekly

# GitHub Actionsを週次scheduleの正本とする。Cloudflare側に同じcronを設定しない。
on:
  schedule:
    # 毎週土曜日 10:00 JST（cronはUTC）
    - cron: "0 1 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: ui-generation-benchmark-weekly
      cancel-in-progress: false
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact_name }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      job-id: ${{ steps.metadata.outputs.job_id }}
    env:
      UI_BENCHMARK_WORKER_URL: ${{ vars.UI_BENCHMARK_WORKER_URL }}
      UI_BENCHMARK_PROMOTED_REVISION: ${{ vars.UI_BENCHMARK_PROMOTED_REVISION }}
      UI_BENCHMARK_IMAGE_DIGEST: ${{ vars.UI_BENCHMARK_IMAGE_DIGEST }}
    steps:
      - name: Initialize diagnostic context
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          CONTEXT_DIR="$RUNNER_TEMP/ui-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export CONTEXT_PATH="$CONTEXT_DIR/workflow-context.json"
          mkdir -p "$CONTEXT_DIR"
          chmod 0700 "$CONTEXT_DIR"
          mkdir -p .benchmark-output
          chmod 0700 .benchmark-output
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const promotedRevision = process.env.UI_BENCHMARK_PROMOTED_REVISION;
          if (!/^[a-f0-9]{40}$/u.test(promotedRevision ?? "")) {
            throw new Error("UI_BENCHMARK_PROMOTED_REVISION is invalid");
          }
          const context = {
            schemaVersion: 2,
            repository: process.env.GITHUB_REPOSITORY,
            workflow: process.env.GITHUB_WORKFLOW,
            eventName: process.env.GITHUB_EVENT_NAME,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            headSha: process.env.GITHUB_SHA,
            promotedRevision,
            createdAt: new Date().toISOString(),
          };
          await writeFile(
            process.env.CONTEXT_PATH,
            `${JSON.stringify(context, null, 2)}\n`,
            { flag: "wx", mode: 0o600 },
          );
          NODE
          install -m 0600 "$CONTEXT_PATH" .benchmark-output/workflow-context.json

      - name: Validate operation configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_READ_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          UI_BENCHMARK_RUN_TOKEN: ${{ secrets.UI_BENCHMARK_RUN_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_R2_READ_TOKEN"
          test -n "$GITHUB_TOKEN"
          test -n "$UI_BENCHMARK_RUN_TOKEN"
          test -n "$UI_BENCHMARK_WORKER_URL"
          test -n "$SLACK_WEBHOOK_URL"
          [[ "$UI_BENCHMARK_PROMOTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$UI_BENCHMARK_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

      - name: Checkout promoted baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ vars.UI_BENCHMARK_PROMOTED_REVISION }}
          persist-credentials: false

      - name: Restore diagnostic context after checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          CONTEXT_PATH="$RUNNER_TEMP/ui-benchmark-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/workflow-context.json"
          mkdir -p .benchmark-output
          chmod 0700 .benchmark-output
          install -m 0600 "$CONTEXT_PATH" .benchmark-output/workflow-context.json

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create immutable run identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          # rerunは作成時刻の異なるmanifestになるため、独立したattemptとして識別する。
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            RUN_ID="ui-weekly-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            IDEMPOTENCY_KEY="weekly-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          else
            RUN_ID="ui-manual-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
            IDEMPOTENCY_KEY="manual-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "idempotency_key=$IDEMPOTENCY_KEY" >> "$GITHUB_OUTPUT"

      - name: Generate promoted-baseline manifest
        env:
          AUTHORIZED_BENCHMARK_REVISION: ${{ vars.UI_BENCHMARK_PROMOTED_REVISION }}
          SANDBOX_IMAGE_DIGEST: ${{ vars.UI_BENCHMARK_IMAGE_DIGEST }}
        shell: bash
        run: |
          set -euo pipefail
          # pnpm --filterはcwdをpackageへ移すため、出力先はworkspace絶対pathで渡す。
          mkdir -p .benchmark-control .benchmark-output
          pnpm --filter @orca/ui-benchmark-sandbox manifest:local -- \
            --run-id "${{ steps.identity.outputs.run_id }}" \
            --output "$GITHUB_WORKSPACE/.benchmark-control/manifest.json" \
            --effort medium \
            --timeout-seconds 3600
          cp .benchmark-control/manifest.json .benchmark-output/run-manifest.json
          chmod 0600 .benchmark-output/run-manifest.json

      - name: Verify private boundary and deployed Worker R2 binding before remote run
        id: publication_boundary_remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_READ_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm --filter @orca/ui-benchmark-sandbox preflight:publication --
          --config "$GITHUB_WORKSPACE/apps/ui-benchmark-sandbox/wrangler.jsonc"
          --output "$GITHUB_WORKSPACE/.benchmark-output/publication-boundary-before-remote.json"

      - name: Verify asynchronous operations and bound R2 sentinel identity
        id: operations_ready_remote
        env:
          UI_BENCHMARK_RUN_TOKEN: ${{ secrets.UI_BENCHMARK_RUN_TOKEN }}
        run: >-
          pnpm --filter @orca/ui-benchmark-sandbox preflight:operations --
          --endpoint "$UI_BENCHMARK_WORKER_URL"
          --publication-boundary "$GITHUB_WORKSPACE/.benchmark-output/publication-boundary-before-remote.json"

      - name: Run, score, and validate remote benchmark
        id: remote
        timeout-minutes: 170
        env:
          UI_BENCHMARK_RUN_TOKEN: ${{ secrets.UI_BENCHMARK_RUN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @orca/ui-benchmark-sandbox run:remote -- \
            --endpoint "$UI_BENCHMARK_WORKER_URL" \
            --manifest "$GITHUB_WORKSPACE/.benchmark-control/manifest.json" \
            --config "$GITHUB_WORKSPACE/apps/ui-benchmark-sandbox/wrangler.jsonc" \
            --publication-boundary "$GITHUB_WORKSPACE/.benchmark-output/publication-boundary-before-remote.json" \
            --idempotency-key "${{ steps.identity.outputs.idempotency_key }}" \
            --output-dir "$GITHUB_WORKSPACE/.benchmark-output" \
            --poll-seconds 30 \
            --timeout-seconds 9600

      - name: Read publication metadata
        id: metadata
        if: ${{ always() }}
        env:
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          JOB_ID=""
          ARTIFACT_ID="${{ steps.identity.outputs.run_id }}"
          if [ -z "$ARTIFACT_ID" ]; then
            ARTIFACT_ID="run-${GITHUB_RUN_ID}"
          fi
          if [ -f .benchmark-output/operation.json ]; then
            CANDIDATE_JOB_ID=$(node -e 'const value=require("./.benchmark-output/operation.json"); process.stdout.write(value.jobId)' 2>/dev/null || true)
            if [[ "$CANDIDATE_JOB_ID" =~ ^job-[a-f0-9]{32}$ ]]; then
              JOB_ID="$CANDIDATE_JOB_ID"
              ARTIFACT_ID="$JOB_ID"
            fi
          fi
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=ui-generation-${ARTIFACT_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          if [ "$REMOTE_OUTCOME" = "success" ] && [ -z "$JOB_ID" ]; then
            echo "remote benchmark succeeded without valid operation metadata" >&2
            exit 1
          fi

      - name: Reverify private boundary and deployed Worker R2 binding before artifact upload
        id: publication_boundary_upload
        if: >-
          ${{
            always() &&
            steps.publication_boundary_remote.outcome == 'success' &&
            steps.operations_ready_remote.outcome == 'success' &&
            hashFiles('.benchmark-output/**') != ''
          }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_READ_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          pnpm --filter @orca/ui-benchmark-sandbox preflight:publication --
          --config "$GITHUB_WORKSPACE/apps/ui-benchmark-sandbox/wrangler.jsonc"
          --output "$GITHUB_WORKSPACE/.benchmark-output/publication-boundary-before-upload.json"

      - name: Reverify bound R2 sentinel identity before artifact upload
        id: operations_ready_upload
        if: >-
          ${{
            always() &&
            steps.publication_boundary_remote.outcome == 'success' &&
            steps.operations_ready_remote.outcome == 'success' &&
            steps.publication_boundary_upload.outcome == 'success'
          }}
        env:
          UI_BENCHMARK_RUN_TOKEN: ${{ secrets.UI_BENCHMARK_RUN_TOKEN }}
        run: >-
          pnpm --filter @orca/ui-benchmark-sandbox preflight:operations --
          --endpoint "$UI_BENCHMARK_WORKER_URL"
          --publication-boundary "$GITHUB_WORKSPACE/.benchmark-output/publication-boundary-before-upload.json"

      - name: Upload generated files and Evidence
        id: upload
        if: >-
          ${{
            always() &&
            steps.publication_boundary_remote.outcome == 'success' &&
            steps.operations_ready_remote.outcome == 'success' &&
            steps.publication_boundary_upload.outcome == 'success' &&
            steps.operations_ready_upload.outcome == 'success' &&
            hashFiles('.benchmark-output/**') != ''
          }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name || format('ui-generation-run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
          path: .benchmark-output/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 0

      - name: Publish review summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node apps/ui-benchmark-sandbox/scripts/notify-weekly-result.mjs
          summary
          review-required
          .benchmark-output/operation.json
          "$ARTIFACT_URL"
          "$RUN_URL"

      - name: Notify review in Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node apps/ui-benchmark-sandbox/scripts/notify-weekly-result.mjs
          slack
          review-required
          .benchmark-output/operation.json
          "$ARTIFACT_URL"
          "$RUN_URL"

  notify-operational-failure:
    needs: generate-and-publish
    if: ${{ always() && needs.generate-and-publish.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish operational failure summary
        env:
          ARTIFACT_URL: ${{ needs.generate-and-publish.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ❌ UI生成ベンチマーク: 運用処理失敗"
            echo
            echo "- [Workflow run](${RUN_URL})"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- [失敗時の診断ファイル](${ARTIFACT_URL})"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify operational failure in Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ARTIFACT_URL: ${{ needs.generate-and-publish.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const webhook = process.env.SLACK_WEBHOOK_URL;
          if (!webhook) {
            console.log("SLACK_WEBHOOK_URL未設定のためSlack通知をスキップしました。");
            process.exit(0);
          }
          const artifact = process.env.ARTIFACT_URL
            ? ` 診断ファイル: ${process.env.ARTIFACT_URL}`
            : "";
          const response = await fetch(webhook, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: `UI生成ベンチマークの運用処理が失敗しました。${process.env.RUN_URL}${artifact}`,
            }),
            signal: AbortSignal.timeout(15_000),
          });
          if (!response.ok) throw new Error(`Slack Webhook returned HTTP ${response.status}`);
          NODE
